<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --text: #1a1f36;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  [data-theme="dark"] {
    --bg: #0f1220;
    --surface: #171a2b;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: #2a2e45;
    --primary: #818cf8;
    --primary-light: #1e1b4b;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Tahoma", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .2s, color .2s;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 1.2rem;
    margin: 0;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  button.icon-btn {
    background: var(--primary-light);
    color: var(--primary);
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }

  button.icon-btn:hover { opacity: 0.85; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .card .label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }

  .card .value {
    font-size: 1.6rem;
    font-weight: 700;
  }

  .card .delta {
    font-size: 0.8rem;
    margin-top: 6px;
  }

  .delta.up { color: var(--success); }
  .delta.down { color: var(--danger); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .panel h2 {
    margin: 0 0 16px;
    font-size: 1rem;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  select, input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 0.85rem;
  }

  canvas { width: 100%; display: block; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    text-align: right;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
  }

  tr:last-child td { border-bottom: none; }

  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .status.done { background: #dcfce7; color: #166534; }
  .status.pending { background: #fef9c3; color: #854d0e; }
  .status.failed { background: #fee2e2; color: #991b1b; }

  [data-theme="dark"] .status.done { background: #14532d; color: #bbf7d0; }
  [data-theme="dark"] .status.pending { background: #713f12; color: #fef08a; }
  [data-theme="dark"] .status.failed { background: #7f1d1d; color: #fecaca; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 24px;
  }

  @media (max-width: 600px) {
    main { padding: 16px; }
    header { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>لوحة التحكم</h1>
  <div class="header-right">
    <button class="icon-btn" id="refreshBtn">تحديث البيانات</button>
    <button class="icon-btn" id="themeBtn">الوضع الليلي</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="panel">
    <div class="panel-header">
      <h2>الزيارات خلال آخر 7 أيام</h2>
      <select id="metricSelect">
        <option value="visits">الزيارات</option>
        <option value="sales">المبيعات</option>
      </select>
    </div>
    <canvas id="chart" height="220"></canvas>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>أحدث الطلبات</h2>
      <input type="text" id="search" placeholder="بحث عن عميل...">
    </div>
    <div style="overflow-x:auto">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>العميل</th>
            <th>المنتج</th>
            <th>المبلغ</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<footer>لوحة تحكم تجريبية — بدون خطوة بناء (Build Step)</footer>

<script>
(function () {
  "use strict";

  // ---------- Theme ----------
  var themeBtn = document.getElementById("themeBtn");
  var root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeBtn.textContent = theme === "dark" ? "الوضع النهاري" : "الوضع الليلي";
    try { localStorage.setItem("dashboard-theme", theme); } catch (e) {}
  }

  var savedTheme = "light";
  try { savedTheme = localStorage.getItem("dashboard-theme") || "light"; } catch (e) {}
  applyTheme(savedTheme);

  themeBtn.addEventListener("click", function () {
    var current = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(current);
  });

  // ---------- Sample Data ----------
  var stats = [
    { label: "إجمالي الزيارات", value: 12480, delta: "+8.2%", dir: "up" },
    { label: "المبيعات", value: "42,300 ر.س", delta: "+3.1%", dir: "up" },
    { label: "المستخدمون الجدد", value: 356, delta: "-1.4%", dir: "down" },
    { label: "معدل الارتداد", value: "38%", delta: "+0.6%", dir: "down" }
  ];

  var series = {
    visits: [1200, 1900, 1500, 2100, 1800, 2400, 2000],
    sales:  [800, 1100, 950, 1400, 1200, 1700, 1500]
  };

  var days = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];

  var orders = [
    { name: "سارة أحمد", product: "اشتراك سنوي", amount: "1,200 ر.س", status: "done" },
    { name: "محمد علي", product: "باقة أساسية", amount: "300 ر.س", status: "pending" },
    { name: "نورة خالد", product: "باقة مميزة", amount: "750 ر.س", status: "done" },
    { name: "عبدالله سعد", product: "اشتراك شهري", amount: "150 ر.س", status: "failed" },
    { name: "ريم فهد", product: "باقة أساسية", amount: "300 ر.س", status: "done" },
    { name: "خالد ناصر", product: "باقة مميزة", amount: "750 ر.س", status: "pending" }
  ];

  // ---------- Render Cards ----------
  var cardsEl = document.getElementById("cards");
  stats.forEach(function (s) {
    var el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      '<div class="label">' + s.label + '</div>' +
      '<div class="value">' + s.value + '</div>' +
      '<div class="delta ' + s.dir + '">' + s.delta + ' مقارنة بالأسبوع الماضي</div>';
    cardsEl.appendChild(el);
  });

  // ---------- Render Chart (vanilla canvas, no deps) ----------
  var canvas = document.getElementById("chart");
  var ctx = canvas.getContext("2d");

  function getCssVar(name) {
    return getComputedStyle(root).getPropertyValue(name).trim();
  }

  function drawChart(data) {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 220 * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var w = rect.width;
    var h = 220;
    var padding = { top: 16, right: 16, bottom: 30, left: 16 };
    var chartW = w - padding.left - padding.right;
    var chartH = h - padding.top - padding.bottom;

    ctx.clearRect(0, 0, w, h);

    var max = Math.max.apply(null, data) * 1.15;
    var stepX = chartW / (data.length - 1);

    // grid lines
    ctx.strokeStyle = getCssVar("--border");
    ctx.lineWidth = 1;
    for (var g = 0; g <= 3; g++) {
      var y = padding.top + (chartH / 3) * g;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(w - padding.right, y);
      ctx.stroke();
    }

    // line path
    var points = data.map(function (v, i) {
      var x = padding.left + stepX * i;
      var y = padding.top + chartH - (v / max) * chartH;
      return [x, y];
    });

    var primary = getCssVar("--primary");

    // filled area
    ctx.beginPath();
    ctx.moveTo(points[0][0], padding.top + chartH);
    points.forEach(function (p) { ctx.lineTo(p[0], p[1]); });
    ctx.lineTo(points[points.length - 1][0], padding.top + chartH);
    ctx.closePath();
    ctx.fillStyle = primary + "22";
    ctx.fill();

    // line
    ctx.beginPath();
    points.forEach(function (p, i) {
      if (i === 0) ctx.moveTo(p[0], p[1]);
      else ctx.lineTo(p[0], p[1]);
    });
    ctx.strokeStyle = primary;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.stroke();

    // points
    points.forEach(function (p) {
      ctx.beginPath();
      ctx.arc(p[0], p[1], 3.5, 0, Math.PI * 2);
      ctx.fillStyle = primary;
      ctx.fill();
    });

    // x labels
    ctx.fillStyle = getCssVar("--muted");
    ctx.font = "11px Tahoma, sans-serif";
    ctx.textAlign = "center";
    points.forEach(function (p, i) {
      ctx.fillText(days[i], p[0], h - 8);
    });
  }

  var metricSelect = document.getElementById("metricSelect");
  function renderChart() {
    drawChart(series[metricSelect.value]);
  }
  metricSelect.addEventListener("change", renderChart);
  window.addEventListener("resize", renderChart);

  // ---------- Render Table ----------
  var statusLabels = { done: "مكتمل", pending: "قيد الانتظار", failed: "فشل" };
  var tbody = document.querySelector("#ordersTable tbody");

  function renderOrders(list) {
    tbody.innerHTML = "";
    list.forEach(function (o) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + o.name + "</td>" +
        "<td>" + o.product + "</td>" +
        "<td>" + o.amount + "</td>" +
        '<td><span class="status ' + o.status + '">' + statusLabels[o.status] + "</span></td>";
      tbody.appendChild(tr);
    });
  }
  renderOrders(orders);

  document.getElementById("search").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase();
    renderOrders(orders.filter(function (o) {
      return o.name.toLowerCase().indexOf(q) !== -1;
    }));
  });

  // ---------- Refresh (simulate new data) ----------
  document.getElementById("refreshBtn").addEventListener("click", function () {
    Object.keys(series).forEach(function (key) {
      series[key] = series[key].map(function (v) {
        var change = Math.round(v * (Math.random() * 0.3 - 0.15));
        return Math.max(100, v + change);
      });
    });
    renderChart();
  });

  renderChart();
})();
</script>

</body>
</html>
